# Tapehead Pro security regression gate.
# Layout assumed: repo root contains `www/` (this zip's `tapehead/` folder). If your repo root IS `www/`,
# move this file to `.github/workflows/` there and delete the `defaults.run.working-directory` lines.
name: security-regression

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline security tests (no secrets, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every script and API route
        run: |
          set -e
          for f in api/*.js js/*.js app.js sw.js cloud-config.js; do node --check "$f"; done
          for f in scripts/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Source-level security assertions
        run: node scripts/verify-security.mjs
      - name: Distributed limiter tests (mock Upstash)
        run: node scripts/test-limiter.mjs
      - name: Behavioural security regression tests
        run: node --test tests/*.test.mjs

  e2e-mobile:
    name: Mobile end-to-end (Chromium, fake mic, fake backend)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test-only, not saved)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Beat, record, mix, bounce, collaboration, layout and offline flows
        run: node --test --test-concurrency=1 e2e/*.e2e.mjs

  live-staging:
    name: Live two-account tests (staging Supabase)
    needs: offline
    # Secrets are not exposed to fork PRs, so this only runs on pushes and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize: both scripts use the same staging accounts and trip rate limits on purpose.
    concurrency:
      group: security-live-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: www
    env:
      STAGING_SUPABASE_REF: ${{ secrets.STAGING_SUPABASE_REF }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      USER_A_EMAIL: ${{ secrets.STAGING_USER_A_EMAIL }}
      USER_A_PASSWORD: ${{ secrets.STAGING_USER_A_PASSWORD }}
      USER_B_EMAIL: ${{ secrets.STAGING_USER_B_EMAIL }}
      USER_B_PASSWORD: ${{ secrets.STAGING_USER_B_PASSWORD }}
      USER_C_EMAIL: ${{ secrets.STAGING_USER_C_EMAIL }}
      USER_C_PASSWORD: ${{ secrets.STAGING_USER_C_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check staging secrets are configured
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$USER_A_EMAIL" ] || [ -z "$USER_B_EMAIL" ]; then
            echo "::warning::Staging secrets are not configured; live authorization tests were SKIPPED."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            case "$SUPABASE_URL" in
              *prod*|*production*) echo "::error::SUPABASE_URL looks like production. Refusing to run destructive tests."; exit 1;;
            esac
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install supabase-js (test-only, not saved)
        if: steps.cfg.outputs.run == 'true'
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js
      - name: Storage / private audio authorization
        if: steps.cfg.outputs.run == 'true'
        run: node scripts/two-user-authz-test.mjs
      - name: Table ownership, RLS and DB rate limits
        if: steps.cfg.outputs.run == 'true'
        run: node scripts/two-user-rls-test.mjs
